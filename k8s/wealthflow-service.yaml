apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthflow-service
  labels:
    app: wealthflow-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wealthflow-service
  template:
    metadata:
      labels:
        app: wealthflow-service
    spec:
      containers:
      - name: wealthflow-service
        image: ai-agent-wealthflow-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: PORT
          value: "8082"
        - name: SECURE_ID
          value: "2108"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wealthflow-service
  labels:
    app: wealthflow-service
spec:
  type: ClusterIP
  selector:
    app: wealthflow-service
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
